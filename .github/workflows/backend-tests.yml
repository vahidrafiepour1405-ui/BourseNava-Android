name: Backend tests and market source check
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q
      - name: Diagnose public market endpoints (no credentials)
        working-directory: .
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          urls = {
              "cdn_tsetmc_search": "https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/%D9%81%D9%85%D9%84%DB%8C",
              "webgw_tse_marketwatch": "https://webgw.tse.ir/InstrumentProvider/api/v1/MarketWatch/MarketWatchCash/fa",
              "majidapi_symbol_search": "https://api.majidapi.ir/bourse?action=search&symbol=%D9%81%D9%85%D9%84%DB%8C",
          }
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; BourseNava endpoint diagnostic)",
              "Accept": "application/json,*/*",
              "Referer": "https://www.tsetmc.com/",
          }
          for name, url in urls.items():
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      body = response.read()
                      try:
                          parsed = json.loads(body.decode("utf-8-sig"))
                          if isinstance(parsed, dict):
                              keys = list(parsed.keys())[:12]
                              preview = str(keys)
                              exact = "فملی" in body.decode("utf-8-sig", errors="replace")
                          elif isinstance(parsed, list):
                              preview = f"list_length={len(parsed)}"
                              exact = "فملی" in body.decode("utf-8-sig", errors="replace")
                          else:
                              preview = type(parsed).__name__
                              exact = False
                          print(f"RESULT {name}: HTTP={response.status} bytes={len(body)} json=yes shape={preview} contains_femelli={exact}")
                      except Exception as exc:
                          print(f"RESULT {name}: HTTP={response.status} bytes={len(body)} json=no parse_error={type(exc).__name__}")
              except urllib.error.HTTPError as exc:
                  print(f"RESULT {name}: HTTP={exc.code} error=HTTPError")
              except Exception as exc:
                  print(f"RESULT {name}: error={type(exc).__name__}: {str(exc)[:180]}")
          PY
